name: Refresh market data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * 1-5'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate normalized data
        run: npm run refresh:data
        env:
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
      - name: Validate
        run: npm test
      - name: Commit changed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/generated-market.json
          git diff --cached --quiet || git commit -m "data: refresh generated market snapshot"
          git push
